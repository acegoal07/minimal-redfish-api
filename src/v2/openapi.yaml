openapi: 3.0.3
info:
   title: Asset Rack API
   description: API for managing racks and assets.
   version: 2.0.0
servers:
   - url: "http://localhost:3000/api/v2"
     description: Local development server for v2
security:
   - bearerAuth: []
tags:
   - name: Templates
     description: Operations for managing templates.
   - name: Users
     description: Operations for managing users and authentication.
   - name: Roles
     description: Operations for managing roles and role permissions.
   - name: Permissions
     description: Read-only list of available permissions.

paths:
   /templates:
      get:
         tags:
            - Templates
         operationId: listTemplates
         summary: List all templates
         responses:
            "200":
               description: List of templates
               content:
                  application/json:
                     schema:
                        type: array
                        items:
                           $ref: "#/components/schemas/Template"
            "401":
               $ref: "#/components/responses/Unauthorised"
            "403":
               $ref: "#/components/responses/Forbidden"
            "500":
               $ref: "#/components/responses/InternalServerError"
      post:
         tags:
            - Templates
         operationId: createTemplate
         summary: Create a template
         requestBody:
            required: true
            content:
               application/json:
                  schema:
                     type: object
                     required:
                        - name
                     properties:
                        name:
                           type: string
                        paths:
                           type: array
                           items:
                              $ref: "#/components/schemas/TemplatePathInput"
         responses:
            "201":
               description: Template created
               content:
                  application/json:
                     schema:
                        $ref: "#/components/schemas/Template"
            "400":
               $ref: "#/components/responses/BadRequest"
            "401":
               $ref: "#/components/responses/Unauthorised"
            "403":
               $ref: "#/components/responses/Forbidden"
            "409":
               $ref: "#/components/responses/Conflict"
            "500":
               $ref: "#/components/responses/InternalServerError"

   /templates/{id}:
      get:
         tags:
            - Templates
         operationId: getTemplate
         summary: Get template by ID
         parameters:
            - $ref: "#/components/parameters/ID"
         responses:
            "200":
               description: Template details
               content:
                  application/json:
                     schema:
                        $ref: "#/components/schemas/Template"
            "403":
               $ref: "#/components/responses/Forbidden"
            "404":
               $ref: "#/components/responses/NotFound"
            "500":
               $ref: "#/components/responses/InternalServerError"
      patch:
         tags:
            - Templates
         operationId: updateTemplate
         summary: Partially update a template
         parameters:
            - $ref: "#/components/parameters/ID"
         requestBody:
            required: true
            content:
               application/json:
                  schema:
                     type: object
                     properties:
                        name:
                           type: string
         responses:
            "200":
               description: Template updated
               content:
                  application/json:
                     schema:
                        $ref: "#/components/schemas/Template"
            "400":
               $ref: "#/components/responses/BadRequest"
            "401":
               $ref: "#/components/responses/Unauthorised"
            "403":
               $ref: "#/components/responses/Forbidden"
            "404":
               $ref: "#/components/responses/NotFound"
            "409":
               $ref: "#/components/responses/Conflict"
            "500":
               $ref: "#/components/responses/InternalServerError"
      delete:
         tags:
            - Templates
         operationId: deleteTemplate
         summary: Delete a template
         parameters:
            - $ref: "#/components/parameters/ID"
         responses:
            "204":
               description: Template deleted
            "401":
               $ref: "#/components/responses/Unauthorised"
            "403":
               $ref: "#/components/responses/Forbidden"
            "404":
               $ref: "#/components/responses/NotFound"
            "500":
               $ref: "#/components/responses/InternalServerError"

   /templates/{id}/paths:
      get:
         tags:
            - Templates
         operationId: listTemplatePaths
         summary: List template paths
         parameters:
            - $ref: "#/components/parameters/ID"
         responses:
            "200":
               description: Template paths
               content:
                  application/json:
                     schema:
                        type: array
                        items:
                           $ref: "#/components/schemas/TemplatePath"
            "401":
               $ref: "#/components/responses/Unauthorised"
            "403":
               $ref: "#/components/responses/Forbidden"
            "404":
               $ref: "#/components/responses/NotFound"
            "500":
               $ref: "#/components/responses/InternalServerError"
      post:
         tags:
            - Templates
         operationId: createTemplatePath
         summary: Add a path to a template
         parameters:
            - $ref: "#/components/parameters/ID"
         requestBody:
            required: true
            content:
               application/json:
                  schema:
                     type: object
                     properties:
                        paths:
                           type: array
                           items:
                              $ref: "#/components/schemas/TemplatePathInput"
         responses:
            "201":
               description: Template path created
               content:
                  application/json:
                     schema:
                        type: array
                        items:
                           $ref: "#/components/schemas/TemplatePath"
            "400":
               $ref: "#/components/responses/BadRequest"
            "401":
               $ref: "#/components/responses/Unauthorised"
            "403":
               $ref: "#/components/responses/Forbidden"
            "404":
               $ref: "#/components/responses/NotFound"
            "409":
               $ref: "#/components/responses/Conflict"
            "500":
               $ref: "#/components/responses/InternalServerError"

   /templates/{id}/paths/{pathId}:
      patch:
         tags:
            - Templates
         operationId: updateTemplatePath
         summary: Update a template path
         parameters:
            - $ref: "#/components/parameters/ID"
            - name: pathId
              in: path
              required: true
              description: Template path identifier.
              schema:
                 type: integer
                 format: int32
         requestBody:
            required: true
            content:
               application/json:
                  schema:
                     type: object
                     properties:
                        name:
                           type: string
                        path:
                           type: string
         responses:
            "200":
               description: Template path updated
               content:
                  application/json:
                     schema:
                        $ref: "#/components/schemas/TemplatePath"
            "400":
               $ref: "#/components/responses/BadRequest"
            "401":
               $ref: "#/components/responses/Unauthorised"
            "403":
               $ref: "#/components/responses/Forbidden"
            "404":
               $ref: "#/components/responses/NotFound"
            "500":
               $ref: "#/components/responses/InternalServerError"

   /templates/search:
      get:
         tags:
            - Templates
         operationId: searchTemplates
         summary: Search templates by ID or name
         description: >
            Searches templates using a query string. If the query is a number, it will
            search by template ID as well as template name. Name searches are case-insensitive.
         parameters:
            - $ref: "#/components/parameters/Query"
         responses:
            "200":
               description: A list of matching templates
               content:
                  application/json:
                     schema:
                        type: array
                        items:
                           $ref: "#/components/schemas/Template"
            "401":
               $ref: "#/components/responses/Unauthorised"
            "403":
               $ref: "#/components/responses/Forbidden"
            "500":
               description: Internal server error

   /users:
      post:
         tags:
            - Users
         operationId: createUser
         summary: Create a user
         requestBody:
            required: true
            content:
               application/json:
                  schema:
                     type: object
                     description: Request body for creating a user
                     required:
                        - username
                        - password
                        - roleId
                     properties:
                        username:
                           type: string
                        password:
                           type: string
                        roleId:
                           type: integer
                           format: int32
         responses:
            "201":
               $ref: "#/components/schemas/User"
            "400":
               $ref: "#/components/responses/BadRequest"
            "401":
               $ref: "#/components/responses/Unauthorised"
            "403":
               $ref: "#/components/responses/Forbidden"
            "409":
               $ref: "#/components/responses/Conflict"
            "500":
               $ref: "#/components/responses/InternalServerError"

   /users/{userId}:
      delete:
         tags:
            - Users
         operationId: deleteUser
         summary: Delete a user
         parameters:
            - name: userId
              in: path
              required: true
              schema:
                 type: string
         responses:
            "204":
               description: User deleted
            "400":
               $ref: "#/components/responses/BadRequest"
            "401":
               $ref: "#/components/responses/Unauthorised"
            "403":
               $ref: "#/components/responses/Forbidden"
            "409":
               $ref: "#/components/responses/Conflict"
            "500":
               $ref: "#/components/responses/InternalServerError"

   /users/{id}:
      patch:
         tags:
            - Users
         operationId: updateUser
         summary: Update a user
         parameters:
            - $ref: "#/components/parameters/ID"
         requestBody:
            required: true
            content:
               application/json:
                  schema:
                     type: object
                     required:
                        - roleId
                     properties:
                        roleId:
                           type: integer
                           format: int32
         responses:
            "204":
               description: User updated
            "400":
               $ref: "#/components/responses/BadRequest"
            "401":
               $ref: "#/components/responses/Unauthorised"
            "403":
               $ref: "#/components/responses/Forbidden"
            "404":
               $ref: "#/components/responses/NotFound"
            "500":
               $ref: "#/components/responses/InternalServerError"

   /users/login:
      post:
         tags:
            - Users
         operationId: loginUser
         requestBody:
            required: true
            content:
               application/json:
                  schema:
                     type: object
                     description: Request body for login in a user
                     required:
                        - username
                        - password
                     properties:
                        username:
                           type: string
                        password:
                           type: string
         responses:
            "200":
               description: The user has been logged in successfully
               content:
                  application/json:
                     schema:
                        type: object
                        properties:
                           issuedAt:
                              type: number
                              description: Time the token was issued
                           token:
                              type: object
                              properties:
                                 token:
                                    type: string
                                 expiresAt:
                                    type: number
                           refresh:
                              type: object
                              properties:
                                 token:
                                    type: string
                                 expiresAt:
                                    type: number
            "400":
               $ref: "#/components/responses/BadRequest"
            "401":
               $ref: "#/components/responses/Unauthorised"
            "500":
               $ref: "#/components/responses/InternalServerError"

   /users/refresh:
      post:
         tags:
            - Users
         operationId: refreshUser
         requestBody:
            required: true
            content:
               application/json:
                  schema:
                     type: object
                     description: Request body for refreshing a user's token
                     required:
                        - token
                     properties:
                        refresh:
                           type: string

         responses:
            "200":
               description: The user's token has been refreshed successfully
               content:
                  application/json:
                     schema:
                        type: object
                        properties:
                           issuedAt:
                              type: number
                              description: Time the token was issued
                           token:
                              type: object
                              properties:
                                 token:
                                    type: string
                                 expiresAt:
                                    type: number
                           refresh:
                              type: object
                              properties:
                                 token:
                                    type: string
                                 expiresAt:
                                    type: number
            "400":
               $ref: "#/components/responses/BadRequest"
            "401":
               $ref: "#/components/responses/Unauthorised"
            "500":
               $ref: "#/components/responses/InternalServerError"
   /users/logout:
      post:
         tags:
            - Users
         operationId: logoutUser

         responses:
            "204":
               description: The user has been logged out successfully
            "400":
               $ref: "#/components/responses/BadRequest"
            "401":
               $ref: "#/components/responses/Unauthorised"
            "500":
               $ref: "#/components/responses/InternalServerError"

   /permissions:
      get:
         tags:
            - Permissions
         operationId: listPermissions
         summary: List all permissions
         responses:
            "200":
               description: List of permissions
               content:
                  application/json:
                     schema:
                        type: array
                        items:
                           $ref: "#/components/schemas/Permission"
            "500":
               $ref: "#/components/responses/InternalServerError"

   /roles:
      post:
         tags:
            - Roles
         operationId: createRole
         summary: Create a role
         requestBody:
            required: true
            content:
               application/json:
                  schema:
                     type: object
                     required:
                        - name
                     properties:
                        name:
                           type: string
                        permissions:
                           type: array
                           items:
                              type: integer
         responses:
            "201":
               description: Role created
               content:
                  application/json:
                     schema:
                        $ref: "#/components/schemas/Role"
            "400":
               $ref: "#/components/responses/BadRequest"
            "401":
               $ref: "#/components/responses/Unauthorised"
            "403":
               $ref: "#/components/responses/Forbidden"
            "409":
               $ref: "#/components/responses/Conflict"
            "500":
               $ref: "#/components/responses/InternalServerError"
      get:
         tags:
            - Roles
         operationId: listRoles
         summary: List all roles
         parameters:
            - name: page
              in: query
              required: false
              description: Page number to return
              schema:
                 type: integer
                 minimum: 1
                 default: 1
            - name: limit
              in: query
              required: false
              description: Number of roles per page
              schema:
                 type: integer
                 minimum: 1
                 default: 25
         responses:
            "200":
               description: List of roles
               content:
                  application/json:
                     schema:
                        type: object
                        properties:
                           page:
                              type: integer
                           limit:
                              type: integer
                           total:
                              type: integer
                           totalPage:
                              type: integer
                           roles:
                              type: array
                              items:
                                 $ref: "#/components/schemas/Role"
            "401":
               $ref: "#/components/responses/Unauthorised"
            "403":
               $ref: "#/components/responses/Forbidden"
            "500":
               $ref: "#/components/responses/InternalServerError"

   /roles/{id}:
      get:
         tags:
            - Roles
         operationId: getRole
         summary: Get role by ID
         parameters:
            - $ref: "#/components/parameters/ID"
         responses:
            "200":
               description: Role details
               content:
                  application/json:
                     schema:
                        $ref: "#/components/schemas/Role"
            "401":
               $ref: "#/components/responses/Unauthorised"
            "403":
               $ref: "#/components/responses/Forbidden"
            "404":
               $ref: "#/components/responses/NotFound"
            "500":
               $ref: "#/components/responses/InternalServerError"
      delete:
         tags:
            - Roles
         operationId: deleteRole
         summary: Delete a role
         parameters:
            - $ref: "#/components/parameters/ID"
         responses:
            "204":
               description: Role deleted
            "401":
               $ref: "#/components/responses/Unauthorised"
            "403":
               $ref: "#/components/responses/Forbidden"
            "404":
               $ref: "#/components/responses/NotFound"
            "500":
               $ref: "#/components/responses/InternalServerError"

   /roles/permissions/{id}/add:
      post:
         tags:
            - Roles
         operationId: addPermissionToRole
         summary: Add permissions to a role
         parameters:
            - name: id
              in: path
              required: true
              description: Role identifier.
              schema:
                 type: integer
                 format: int32
         requestBody:
            required: true
            content:
               application/json:
                  schema:
                     type: object
                     required:
                        - permissions
                     properties:
                        permissions:
                           type: array
                           items:
                              type: integer
         responses:
            "200":
               description: Role updated
               content:
                  application/json:
                     schema:
                        $ref: "#/components/schemas/Role"
            "400":
               $ref: "#/components/responses/BadRequest"
            "401":
               $ref: "#/components/responses/Unauthorised"
            "403":
               $ref: "#/components/responses/Forbidden"
            "404":
               $ref: "#/components/responses/NotFound"
            "500":
               $ref: "#/components/responses/InternalServerError"

   /roles/search:
      get:
         tags:
            - Roles
         operationId: searchRoles
         summary: Search roles by ID or name
         parameters:
            - name: query
              in: query
              required: false
              description: Query string to search by name or ID
              schema:
                 type: string
            - name: page
              in: query
              required: false
              schema:
                 type: integer
                 default: 1
            - name: limit
              in: query
              required: false
              schema:
                 type: integer
                 default: 25
         responses:
            "200":
               description: Matching roles
               content:
                  application/json:
                     schema:
                        type: object
                        properties:
                           page:
                              type: integer
                           limit:
                              type: integer
                           total:
                              type: integer
                           totalPage:
                              type: integer
                           roles:
                              type: array
                              items:
                                 $ref: "#/components/schemas/Role"
            "401":
               $ref: "#/components/responses/Unauthorised"
            "403":
               $ref: "#/components/responses/Forbidden"
            "500":
               $ref: "#/components/responses/InternalServerError"
   /roles/permissions/{id}/remove:
      post:
         tags:
            - Roles
         operationId: removePermissionFromRole
         summary: Remove permissions from a role
         parameters:
            - name: id
              in: path
              required: true
              description: Role identifier.
              schema:
                 type: integer
                 format: int32
         requestBody:
            required: true
            content:
               application/json:
                  schema:
                     type: object
                     required:
                        - permissions
                     properties:
                        permissions:
                           type: array
                           items:
                              type: integer
         responses:
            "200":
               description: Role updated
               content:
                  application/json:
                     schema:
                        $ref: "#/components/schemas/Role"
            "400":
               $ref: "#/components/responses/BadRequest"
            "401":
               $ref: "#/components/responses/Unauthorised"
            "403":
               $ref: "#/components/responses/Forbidden"
            "404":
               $ref: "#/components/responses/NotFound"
            "500":
               $ref: "#/components/responses/InternalServerError"

components:
   securitySchemes:
      bearerAuth:
         type: http
         scheme: bearer
         bearerFormat: JWT
         description: Enter your JWT token in the format 'Bearer <token>'.

   parameters:
      ID:
         name: id
         in: path
         required: true
         description: Resource identifier.
         schema:
            type: integer
            format: int32

      Query:
         name: query
         in: query
         description: A sting to be searched.
         schema:
            type: string

   schemas:
      User:
         type: object
         description: The user response
         required:
            - id
         properties:
            id:
               type: integer
               format: int32

      Template:
         type: object
         required:
            - id
            - name
         properties:
            id:
               type: integer
               format: int32
            name:
               type: string
            paths:
               type: array
               items:
                  $ref: "#/components/schemas/TemplatePath"

      TemplatePathInput:
         type: object
         required:
            - path
            - name
         properties:
            path:
               type: string
            name:
               type: string

      TemplatePath:
         type: object
         required:
            - id
            - path
            - name
         properties:
            id:
               type: integer
               format: int32
            path:
               type: string
            name:
               type: string

      Permission:
         type: object
         required:
            - id
            - name
         properties:
            id:
               type: integer
               format: int32
            name:
               type: string

      Role:
         type: object
         required:
            - id
            - name
         properties:
            id:
               type: integer
               format: int32
            name:
               type: string
            permissions:
               type: array
               items:
                  $ref: "#/components/schemas/Permission"

      Error:
         type: object
         description: Standard API error response.
         required:
            - error
            - message
         properties:
            error:
               type: string
               example: NOT_FOUND
            message:
               type: string
               example: The requested resource could not be found.
            details:
               type: object
               additionalProperties: true

   responses:
      BadRequest:
         description: Invalid request.
         content:
            application/json:
               schema:
                  $ref: "#/components/schemas/Error"
               example:
                  error: INVALID_REQUEST
                  message: One or more request fields are invalid.

      NotFound:
         description: Resource not found.
         content:
            application/json:
               schema:
                  $ref: "#/components/schemas/Error"
               example:
                  error: NOT_FOUND
                  message: The requested resource does not exist.

      Conflict:
         description: Request conflicts with an existing resource.
         content:
            application/json:
               schema:
                  $ref: "#/components/schemas/Error"
               example:
                  error: CONFLICT
                  message: An asset already exists at the requested position.

      InternalServerError:
         description: Internal server error.
         content:
            application/json:
               schema:
                  $ref: "#/components/schemas/Error"
               example:
                  error: INTERNAL_SERVER_ERROR
                  message: An unexpected error occurred.

      Forbidden:
         description: User doesn't hav permission to perform that action.
         content:
            application/json:
               schema:
                  $ref: "#/components/schemas/Error"
               example:
                  error: FORBIDDEN
                  message: Access denied, you do not have permission to perform this action.

      Unauthorised:
         description: User needs to be logged into to access the endpoint.
         content:
            application/json:
               schema:
                  $ref: "#/components/schemas/Error"
               example:
                  error: UNAUTHORISED
                  message: You need to login to perform this action.
