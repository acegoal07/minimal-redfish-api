openapi: 3.0.3
info:
   title: Asset Rack API
   description: API for managing racks and assets.
   version: 1.0.2
servers:
   - url: "http://localhost:3000/api/v1"
     description: Local development server for v1
security:
   - bearerAuth: []
tags:
   - name: Assets
     description: Operations for managing assets.
   - name: Racks
     description: Operations for managing racks.

paths:
   /assets:
      get:
         tags:
            - Assets
         operationId: listAssets
         summary: List all assets
         responses:
            "200":
               description: List of assets
               content:
                  application/json:
                     schema:
                        type: array
                        items:
                           $ref: "#/components/schemas/Asset"
            "401":
               $ref: "#/components/responses/Unauthorised"
            "403":
               $ref: "#/components/responses/Forbidden"
            "500":
               $ref: "#/components/responses/InternalServerError"
      post:
         tags:
            - Assets
         operationId: createAsset
         summary: Create an asset
         requestBody:
            required: true
            content:
               application/json:
                  schema:
                     type: object
                     description: Request body for creating an asset.
                     required:
                        - rackId
                        - name
                        - size
                        - position
                     properties:
                        rackId:
                           type: integer
                           format: int32
                        name:
                           type: string
                        size:
                           type: integer
                           format: int32
                        position:
                           type: integer
                           format: int32
                        data:
                           type: array
                           items:
                              $ref: "#/components/schemas/AssetData"
                        json:
                           $ref: "#/components/schemas/AssetJson"
         responses:
            "201":
               description: Asset created
               content:
                  application/json:
                     schema:
                        $ref: "#/components/schemas/Asset"
            "400":
               $ref: "#/components/responses/BadRequest"
            "401":
               $ref: "#/components/responses/Unauthorised"
            "403":
               $ref: "#/components/responses/Forbidden"
            "409":
               $ref: "#/components/responses/Conflict"
            "500":
               $ref: "#/components/responses/InternalServerError"

   /assets/{id}:
      get:
         tags:
            - Assets
         operationId: getAsset
         summary: Get asset by ID
         parameters:
            - $ref: "#/components/parameters/ID"
         responses:
            "200":
               description: Asset details
               content:
                  application/json:
                     schema:
                        $ref: "#/components/schemas/Asset"
            "401":
               $ref: "#/components/responses/Unauthorised"
            "403":
               $ref: "#/components/responses/Forbidden"
            "404":
               $ref: "#/components/responses/NotFound"
            "500":
               $ref: "#/components/responses/InternalServerError"
      put:
         tags:
            - Assets
         operationId: replaceAssetJson
         summary: Replace an asset's JSON payload
         parameters:
            - $ref: "#/components/parameters/ID"
         requestBody:
            required: true
            content:
               application/json:
                  schema:
                     type: object
                     description: Replace the stored JSON payload.
                     required:
                        - json
                     properties:
                        json:
                           $ref: "#/components/schemas/AssetJson"
         responses:
            "200":
               description: Asset updated
               content:
                  application/json:
                     schema:
                        $ref: "#/components/schemas/Asset"
            "400":
               $ref: "#/components/responses/BadRequest"
            "401":
               $ref: "#/components/responses/Unauthorised"
            "403":
               $ref: "#/components/responses/Forbidden"
            "404":
               $ref: "#/components/responses/NotFound"
            "500":
               $ref: "#/components/responses/InternalServerError"
      patch:
         tags:
            - Assets
         operationId: updateAsset
         summary: Partially update an asset
         parameters:
            - $ref: "#/components/parameters/ID"
         requestBody:
            required: true
            content:
               application/json:
                  schema:
                     type: object
                     description: Fields that may be updated on an asset.
                     properties:
                        rackId:
                           type: integer
                           format: int32
                        name:
                           type: string
                        size:
                           type: integer
                           format: int32
                        position:
                           type: integer
                           format: int32
         responses:
            "200":
               description: Asset updated
               content:
                  application/json:
                     schema:
                        $ref: "#/components/schemas/Asset"
            "400":
               $ref: "#/components/responses/BadRequest"
            "401":
               $ref: "#/components/responses/Unauthorised"
            "403":
               $ref: "#/components/responses/Forbidden"
            "404":
               $ref: "#/components/responses/NotFound"
            "409":
               $ref: "#/components/responses/Conflict"
            "500":
               $ref: "#/components/responses/InternalServerError"
      delete:
         tags:
            - Assets
         operationId: deleteAsset
         summary: Delete an asset
         parameters:
            - $ref: "#/components/parameters/ID"
         responses:
            "204":
               description: Asset deleted
            "401":
               $ref: "#/components/responses/Unauthorised"
            "403":
               $ref: "#/components/responses/Forbidden"
            "404":
               $ref: "#/components/responses/NotFound"
            "500":
               $ref: "#/components/responses/InternalServerError"

   /assets/{id}/paths:
      get:
         tags:
            - Assets
         operationId: listAssetPaths
         summary: List asset paths
         parameters:
            - $ref: "#/components/parameters/ID"
         responses:
            "200":
               description: Asset paths
               content:
                  application/json:
                     schema:
                        type: array
                        items:
                           $ref: "#/components/schemas/AssetData"
            "401":
               $ref: "#/components/responses/Unauthorised"
            "403":
               $ref: "#/components/responses/Forbidden"
            "404":
               $ref: "#/components/responses/NotFound"
            "500":
               $ref: "#/components/responses/InternalServerError"
      post:
         tags:
            - Assets
         operationId: createAssetPath
         summary: Add a path to an asset
         parameters:
            - $ref: "#/components/parameters/ID"
         requestBody:
            required: true
            content:
               application/json:
                  schema:
                     type: array
                     items:
                        $ref: "#/components/schemas/AssetDataInput"
         responses:
            "201":
               description: Path added
               content:
                  application/json:
                     schema:
                        type: array
                        items:
                           $ref: "#/components/schemas/AssetData"
            "400":
               $ref: "#/components/responses/BadRequest"
            "401":
               $ref: "#/components/responses/Unauthorised"
            "403":
               $ref: "#/components/responses/Forbidden"
            "404":
               $ref: "#/components/responses/NotFound"
            "409":
               $ref: "#/components/responses/Conflict"
            "500":
               $ref: "#/components/responses/InternalServerError"

   /assets/{id}/paths/{pathId}:
      patch:
         tags:
            - Assets
         operationId: updateAssetPath
         summary: Update an asset path
         parameters:
            - $ref: "#/components/parameters/ID"
            - name: pathId
              in: path
              required: true
              description: Asset path identifier.
              schema:
                 type: integer
                 format: int32
         requestBody:
            required: true
            content:
               application/json:
                  schema:
                     $ref: "#/components/schemas/AssetDataInput"
         responses:
            "200":
               description: Path updated
               content:
                  application/json:
                     schema:
                        $ref: "#/components/schemas/AssetData"
            "400":
               $ref: "#/components/responses/BadRequest"
            "401":
               $ref: "#/components/responses/Unauthorised"
            "403":
               $ref: "#/components/responses/Forbidden"
            "404":
               $ref: "#/components/responses/NotFound"
            "500":
               $ref: "#/components/responses/InternalServerError"

   /assets/{id}/history:
      get:
         tags:
            - Assets
         operationId: listAssetHistory
         summary: Get asset history
         parameters:
            - $ref: "#/components/parameters/ID"
         responses:
            "200":
               description: Asset history
               content:
                  application/json:
                     schema:
                        type: array
                        items:
                           $ref: "#/components/schemas/AssetJson"
            "401":
               $ref: "#/components/responses/Unauthorised"
            "403":
               $ref: "#/components/responses/Forbidden"
            "404":
               $ref: "#/components/responses/NotFound"
            "500":
               $ref: "#/components/responses/InternalServerError"

   /assets/{id}/history/{historyId}:
      delete:
         tags:
            - Assets
         operationId: deleteAssetHistory
         summary: Delete an asset history entry
         parameters:
            - $ref: "#/components/parameters/ID"
            - name: historyId
              in: path
              required: true
              description: History entry identifier.
              schema:
                 type: integer
                 format: int32
         responses:
            "204":
               description: History deleted
            "401":
               $ref: "#/components/responses/Unauthorised"
            "403":
               $ref: "#/components/responses/Forbidden"
            "404":
               $ref: "#/components/responses/NotFound"
            "500":
               $ref: "#/components/responses/InternalServerError"

   /assets/{id}/{index}:
      get:
         tags:
            - Assets
         operationId: getAssetByIndex
         summary: Get asset by ID and index
         parameters:
            - $ref: "#/components/parameters/ID"
            - name: index
              in: path
              required: true
              description: Asset index.
              schema:
                 type: integer
                 format: int32
         responses:
            "200":
               description: Asset details
               content:
                  application/json:
                     schema:
                        $ref: "#/components/schemas/Asset"
            "401":
               $ref: "#/components/responses/Unauthorised"
            "403":
               $ref: "#/components/responses/Forbidden"
            "404":
               $ref: "#/components/responses/NotFound"
            "500":
               $ref: "#/components/responses/InternalServerError"

   /assets/search:
      get:
         tags:
            - Assets
         operationId: searchAsset
         summary: Search assets by ID or name
         description: >
            Searches assets using a query string. If the query is a number, it will
            search by asset ID as well as asset name. Name searches are case-insensitive.
         parameters:
            - $ref: "#/components/parameters/Query"
         responses:
            "200":
               description: A list of matching assets
               content:
                  application/json:
                     schema:
                        type: array
                        items:
                           $ref: "#/components/schemas/Asset"
            "401":
               $ref: "#/components/responses/Unauthorised"
            "403":
               $ref: "#/components/responses/Forbidden"
            "500":
               description: Internal server error

   /racks:
      get:
         tags:
            - Racks
         operationId: listRacks
         summary: List all racks
         responses:
            "200":
               description: List of racks
               content:
                  application/json:
                     schema:
                        type: array
                        items:
                           $ref: "#/components/schemas/Rack"
            "401":
               $ref: "#/components/responses/Unauthorised"
            "403":
               $ref: "#/components/responses/Forbidden"
            "500":
               $ref: "#/components/responses/InternalServerError"
      post:
         tags:
            - Racks
         operationId: createRack
         summary: Create a rack
         requestBody:
            required: true
            content:
               application/json:
                  schema:
                     type: object
                     description: Request body for creating a rack.
                     required:
                        - name
                        - size
                     properties:
                        name:
                           type: string
                        size:
                           type: integer
                           format: int32
                        notes:
                           type: string
         responses:
            "201":
               description: Rack created
               content:
                  application/json:
                     schema:
                        $ref: "#/components/schemas/Rack"
            "400":
               $ref: "#/components/responses/BadRequest"
            "401":
               $ref: "#/components/responses/Unauthorised"
            "403":
               $ref: "#/components/responses/Forbidden"
            "409":
               $ref: "#/components/responses/Conflict"
            "500":
               $ref: "#/components/responses/InternalServerError"

   /racks/{id}:
      get:
         tags:
            - Racks
         operationId: getRack
         summary: Get rack by ID
         parameters:
            - $ref: "#/components/parameters/ID"
         responses:
            "200":
               description: Rack details
               content:
                  application/json:
                     schema:
                        $ref: "#/components/schemas/Rack"
            "401":
               $ref: "#/components/responses/Unauthorised"
            "403":
               $ref: "#/components/responses/Forbidden"
            "404":
               $ref: "#/components/responses/NotFound"
            "500":
               $ref: "#/components/responses/InternalServerError"
      patch:
         tags:
            - Racks
         operationId: updateRack
         summary: Partially update a rack
         parameters:
            - $ref: "#/components/parameters/ID"
         requestBody:
            required: true
            content:
               application/json:
                  schema:
                     type: object
                     description: Fields that may be updated on a rack.
                     properties:
                        name:
                           type: string
                        size:
                           type: integer
                           format: int32
                        notes:
                           type: string
         responses:
            "200":
               description: Rack updated
               content:
                  application/json:
                     schema:
                        $ref: "#/components/schemas/Rack"
            "400":
               $ref: "#/components/responses/BadRequest"
            "401":
               $ref: "#/components/responses/Unauthorised"
            "403":
               $ref: "#/components/responses/Forbidden"
            "404":
               $ref: "#/components/responses/NotFound"
            "409":
               $ref: "#/components/responses/Conflict"
            "500":
               $ref: "#/components/responses/InternalServerError"
      delete:
         tags:
            - Racks
         operationId: deleteRack
         summary: Delete a rack
         parameters:
            - $ref: "#/components/parameters/ID"
         responses:
            "204":
               description: Rack deleted
            "401":
               $ref: "#/components/responses/Unauthorised"
            "403":
               $ref: "#/components/responses/Forbidden"
            "404":
               $ref: "#/components/responses/NotFound"
            "500":
               $ref: "#/components/responses/InternalServerError"

   /racks/{id}/assets:
      get:
         tags:
            - Racks
         operationId: listRackAssets
         summary: List assets in a rack
         parameters:
            - $ref: "#/components/parameters/ID"
         responses:
            "200":
               description: Assets belonging to the rack
               content:
                  application/json:
                     schema:
                        type: array
                        items:
                           $ref: "#/components/schemas/Asset"
            "401":
               $ref: "#/components/responses/Unauthorised"
            "403":
               $ref: "#/components/responses/Forbidden"
            "404":
               $ref: "#/components/responses/NotFound"
            "500":
               $ref: "#/components/responses/InternalServerError"

   /racks/search:
      get:
         tags:
            - Racks
         operationId: searchRack
         summary: Search racks by ID or name
         description: >
            Searches racks using a query string. If the query is a number, it will
            search by rack ID as well as rack name. Name searches are case-insensitive.
         parameters:
            - $ref: "#/components/parameters/Query"
         responses:
            "200":
               description: A list of matching racks
               content:
                  application/json:
                     schema:
                        type: array
                        items:
                           $ref: "#/components/schemas/Rack"
            "401":
               $ref: "#/components/responses/Unauthorised"
            "403":
               $ref: "#/components/responses/Forbidden"
            "500":
               description: Internal server error

   /templates:
      get:
         tags:
            - Templates
         operationId: listTemplates
         summary: List all templates
         responses:
            "200":
               description: List of templates
               content:
                  application/json:
                     schema:
                        type: array
                        items:
                           $ref: "#/components/schemas/Template"
            "401":
               $ref: "#/components/responses/Unauthorised"
            "403":
               $ref: "#/components/responses/Forbidden"
            "500":
               $ref: "#/components/responses/InternalServerError"
      post:
         tags:
            - Templates
         operationId: createTemplate
         summary: Create a template
         requestBody:
            required: true
            content:
               application/json:
                  schema:
                     type: object
                     required:
                        - name
                     properties:
                        name:
                           type: string
                        paths:
                           type: array
                           items:
                              $ref: "#/components/schemas/TemplatePathInput"
         responses:
            "201":
               description: Template created
               content:
                  application/json:
                     schema:
                        $ref: "#/components/schemas/Template"
            "400":
               $ref: "#/components/responses/BadRequest"
            "401":
               $ref: "#/components/responses/Unauthorised"
            "403":
               $ref: "#/components/responses/Forbidden"
            "409":
               $ref: "#/components/responses/Conflict"
            "500":
               $ref: "#/components/responses/InternalServerError"

   /templates/{id}:
      get:
         tags:
            - Templates
         operationId: getTemplate
         summary: Get template by ID
         parameters:
            - $ref: "#/components/parameters/ID"
         responses:
            "200":
               description: Template details
               content:
                  application/json:
                     schema:
                        $ref: "#/components/schemas/Template"
            "403":
               $ref: "#/components/responses/Forbidden"
            "404":
               $ref: "#/components/responses/NotFound"
            "500":
               $ref: "#/components/responses/InternalServerError"
      patch:
         tags:
            - Templates
         operationId: updateTemplate
         summary: Partially update a template
         parameters:
            - $ref: "#/components/parameters/ID"
         requestBody:
            required: true
            content:
               application/json:
                  schema:
                     type: object
                     properties:
                        name:
                           type: string
         responses:
            "200":
               description: Template updated
               content:
                  application/json:
                     schema:
                        $ref: "#/components/schemas/Template"
            "400":
               $ref: "#/components/responses/BadRequest"
            "401":
               $ref: "#/components/responses/Unauthorised"
            "403":
               $ref: "#/components/responses/Forbidden"
            "404":
               $ref: "#/components/responses/NotFound"
            "409":
               $ref: "#/components/responses/Conflict"
            "500":
               $ref: "#/components/responses/InternalServerError"
      delete:
         tags:
            - Templates
         operationId: deleteTemplate
         summary: Delete a template
         parameters:
            - $ref: "#/components/parameters/ID"
         responses:
            "204":
               description: Template deleted
            "401":
               $ref: "#/components/responses/Unauthorised"
            "403":
               $ref: "#/components/responses/Forbidden"
            "404":
               $ref: "#/components/responses/NotFound"
            "500":
               $ref: "#/components/responses/InternalServerError"

   /templates/{id}/paths:
      get:
         tags:
            - Templates
         operationId: listTemplatePaths
         summary: List template paths
         parameters:
            - $ref: "#/components/parameters/ID"
         responses:
            "200":
               description: Template paths
               content:
                  application/json:
                     schema:
                        type: array
                        items:
                           $ref: "#/components/schemas/TemplatePath"
            "401":
               $ref: "#/components/responses/Unauthorised"
            "403":
               $ref: "#/components/responses/Forbidden"
            "404":
               $ref: "#/components/responses/NotFound"
            "500":
               $ref: "#/components/responses/InternalServerError"
      post:
         tags:
            - Templates
         operationId: createTemplatePath
         summary: Add a path to a template
         parameters:
            - $ref: "#/components/parameters/ID"
         requestBody:
            required: true
            content:
               application/json:
                  schema:
                     type: array
                     items:
                        $ref: "#/components/schemas/TemplatePathInput"
         responses:
            "201":
               description: Template path created
               content:
                  application/json:
                     schema:
                        type: array
                        items:
                           $ref: "#/components/schemas/TemplatePath"
            "400":
               $ref: "#/components/responses/BadRequest"
            "401":
               $ref: "#/components/responses/Unauthorised"
            "403":
               $ref: "#/components/responses/Forbidden"
            "404":
               $ref: "#/components/responses/NotFound"
            "409":
               $ref: "#/components/responses/Conflict"
            "500":
               $ref: "#/components/responses/InternalServerError"

   /templates/{id}/paths/{pathId}:
      patch:
         tags:
            - Templates
         operationId: updateTemplatePath
         summary: Update a template path
         parameters:
            - $ref: "#/components/parameters/ID"
            - name: pathId
              in: path
              required: true
              description: Template path identifier.
              schema:
                 type: integer
                 format: int32
         requestBody:
            required: true
            content:
               application/json:
                  schema:
                     type: object
                     properties:
                        name:
                           type: string
                        path:
                           type: string
         responses:
            "200":
               description: Template path updated
               content:
                  application/json:
                     schema:
                        $ref: "#/components/schemas/TemplatePath"
            "400":
               $ref: "#/components/responses/BadRequest"
            "401":
               $ref: "#/components/responses/Unauthorised"
            "403":
               $ref: "#/components/responses/Forbidden"
            "404":
               $ref: "#/components/responses/NotFound"
            "500":
               $ref: "#/components/responses/InternalServerError"

   /template/search:
      get:
         tags:
            - Templates
         operationId: searchTemplates
         summary: Search templates by ID or name
         description: >
            Searches templates using a query string. If the query is a number, it will
            search by template ID as well as template name. Name searches are case-insensitive.
         parameters:
            - $ref: "#/components/parameters/Query"
         responses:
            "200":
               description: A list of matching templates
               content:
                  application/json:
                     schema:
                        type: array
                        items:
                           $ref: "#/components/schemas/Template"
            "401":
               $ref: "#/components/responses/Unauthorised"
            "403":
               $ref: "#/components/responses/Forbidden"
            "500":
               description: Internal server error

   /users:
      post:
         tags:
            - Users
         operationId: createUser
         summary: Create a user
         requestBody:
            required: true
            content:
               application/json:
                  schema:
                     type: object
                     description: Request body for creating a user
                     required:
                        - username
                        - password
                        - roleId
                     properties:
                        username:
                           type: string
                        password:
                           type: string
                        roleId:
                           type: integer
                           format: int32
         responses:
            "201":
               $ref: "#/components/schemas/User"
            "400":
               $ref: "#/components/responses/BadRequest"
            "401":
               $ref: "#/components/responses/Unauthorised"
            "403":
               $ref: "#/components/responses/Forbidden"
            "409":
               $ref: "#/components/responses/Conflict"
            "500":
               $ref: "#/components/responses/InternalServerError"

   /users/{userId}:
      delete:
         tags:
            - Users
         operationId: deleteUser
         summary: Delete a user
         parameters:
            - name: userId
              in: path
              required: true
              schema:
                 type: string
         responses:
            "204":
               description: User deleted
            "400":
               $ref: "#/components/responses/BadRequest"
            "401":
               $ref: "#/components/responses/Unauthorised"
            "403":
               $ref: "#/components/responses/Forbidden"
            "409":
               $ref: "#/components/responses/Conflict"
            "500":
               $ref: "#/components/responses/InternalServerError"

   /users/login:
      post:
         tags:
            - Users
         operationId: loginUser
         requestBody:
            required: true
            content:
               application/json:
                  schema:
                     type: object
                     description: Request body for login in a user
                     required:
                        - username
                        - password
                     properties:
                        username:
                           type: string
                        password:
                           type: string
         responses:
            "200":
               description: The user has been logged in successfully
               content:
                  application/json:
                     schema:
                        properties:
                           token:
                              type: string
                           expiresAt:
                              type: number
                           issuedAt:
                              type: number
            "400":
               $ref: "#/components/responses/BadRequest"
            "401":
               $ref: "#/components/responses/Unauthorised"
            "500":
               $ref: "#/components/responses/InternalServerError"

components:
   securitySchemes:
      bearerAuth:
         type: http
         scheme: bearer
         bearerFormat: JWT
         description: Enter your JWT token in the format 'Bearer <token>'.

   parameters:
      ID:
         name: id
         in: path
         required: true
         description: Resource identifier.
         schema:
            type: integer
            format: int32

      Query:
         name: query
         in: query
         description: A sting to be searched.
         schema:
            type: string

   schemas:
      Asset:
         type: object
         description: An asset stored within a rack.
         required:
            - id
            - rackId
            - name
            - size
            - position
         properties:
            id:
               type: integer
               format: int32
               description: Asset identifier.
            rackId:
               type: integer
               format: int32
               description: Rack containing the asset.
            name:
               type: string
               description: Asset name.
            size:
               type: integer
               format: int32
               description: Height of the asset in rack units.
            position:
               type: integer
               format: int32
               description: Starting rack position.
            data:
               type: array
               description: Asset path data.
               items:
                  $ref: "#/components/schemas/AssetData"
            json:
               $ref: "#/components/schemas/AssetJson"
            pagination:
               $ref: "#/components/schemas/Pagination"

      AssetJson:
         type: object
         description: JSON payload associated with an asset.
         required:
            - text
            - filename
         properties:
            id:
               type: integer
               description: The id of the json in the history database
            text:
               type: string
               description: JSON content.
            filename:
               type: string
               description: Original filename.

      AssetData:
         type: object
         description: Asset path entry.
         required:
            - id
            - path
            - name
         properties:
            id:
               type: integer
               format: int32
            path:
               type: string
            name:
               type: string
            value:
               type: string
               nullable: true

      AssetDataInput:
         type: object
         description: Request body for creating or updating an asset path.
         required:
            - path
            - name
         properties:
            path:
               type: string
            name:
               type: string

      Rack:
         type: object
         description: A rack containing assets.
         required:
            - id
            - name
            - size
         properties:
            id:
               type: integer
               format: int32
            name:
               type: string
            size:
               type: integer
               format: int32
            notes:
               type: string
               nullable: true

      Pagination:
         type: object
         description: Pagination metadata.
         required:
            - position
            - total
         properties:
            position:
               type: integer
               format: int32
            total:
               type: integer
               format: int32

      User:
         type: object
         description: The user response
         required:
            - id
         properties:
            id:
               type: integer
               format: int32

      Template:
         type: object
         required:
            - id
            - name
         properties:
            id:
               type: integer
               format: int32
            name:
               type: string
            paths:
               type: array
               items:
                  $ref: "#/components/schemas/TemplatePath"
      
      TemplatePathInput:
         type: object
         required:
            - path
            - name
         properties:
            path:
               type: string
            name:
               type: string

      TemplatePath:
         type: object
         required:
            - id
            - path
            - name
         properties:
            id:
               type: integer
               format: int32
            path:
               type: string
            name:
               type: string

      Error:
         type: object
         description: Standard API error response.
         required:
            - error
            - message
         properties:
            error:
               type: string
               example: NOT_FOUND
            message:
               type: string
               example: The requested resource could not be found.
            details:
               type: object
               additionalProperties: true

   responses:
      BadRequest:
         description: Invalid request.
         content:
            application/json:
               schema:
                  $ref: "#/components/schemas/Error"
               example:
                  error: INVALID_REQUEST
                  message: One or more request fields are invalid.

      NotFound:
         description: Resource not found.
         content:
            application/json:
               schema:
                  $ref: "#/components/schemas/Error"
               example:
                  error: NOT_FOUND
                  message: The requested resource does not exist.

      Conflict:
         description: Request conflicts with an existing resource.
         content:
            application/json:
               schema:
                  $ref: "#/components/schemas/Error"
               example:
                  error: CONFLICT
                  message: An asset already exists at the requested position.

      InternalServerError:
         description: Internal server error.
         content:
            application/json:
               schema:
                  $ref: "#/components/schemas/Error"
               example:
                  error: INTERNAL_SERVER_ERROR
                  message: An unexpected error occurred.

      Forbidden:
         description: User doesn't hav permission to perform that action.
         content:
            application/json:
               schema:
                  $ref: "#/components/schemas/Error"
               example:
                  error: FORBIDDEN
                  message: Access denied, you do not have permission to perform this action.

      Unauthorised:
         description: User needs to be logged into to access the endpoint.
         content:
            application/json:
               schema:
                  $ref: "#/components/schemas/Error"
               example:
                  error: UNAUTHORISED
                  message: You need to login to perform this action.
