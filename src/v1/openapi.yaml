openapi: 3.0.3
info:
   title: Asset Rack API
   description: API for managing racks and assets.
   version: 1.0.1
servers:
   - url: 'http://localhost:3000/api/v1'
     description: Local development server for v1
tags:
   - name: Assets
     description: Operations for managing assets.
   - name: Racks
     description: Operations for managing racks.

paths:
   /assets:
      get:
         tags:
            - Assets
         operationId: listAssets
         summary: List all assets
         responses:
            '200':
               description: List of assets
               content:
                  application/json:
                     schema:
                        type: array
                        items:
                           $ref: '#/components/schemas/Asset'
            '500':
               $ref: '#/components/responses/InternalServerError'
      post:
         tags:
            - Assets
         operationId: createAsset
         summary: Create an asset
         requestBody:
            required: true
            content:
               application/json:
                  schema:
                     $ref: '#/components/schemas/AssetCreate'
         responses:
            '201':
               description: Asset created
               content:
                  application/json:
                     schema:
                        $ref: '#/components/schemas/Asset'
            '400':
               $ref: '#/components/responses/BadRequest'
            '409':
               $ref: '#/components/responses/Conflict'
            '500':
               $ref: '#/components/responses/InternalServerError'

   '/assets/{id}':
      get:
         tags:
            - Assets
         operationId: getAsset
         summary: Get asset by ID
         parameters:
            - $ref: '#/components/parameters/Id'
         responses:
            '200':
               description: Asset details
               content:
                  application/json:
                     schema:
                        $ref: '#/components/schemas/Asset'
            '404':
               $ref: '#/components/responses/NotFound'
            '500':
               $ref: '#/components/responses/InternalServerError'
      put:
         tags:
            - Assets
         operationId: replaceAssetJson
         summary: Replace an asset's JSON payload
         parameters:
            - $ref: '#/components/parameters/Id'
         requestBody:
            required: true
            content:
               application/json:
                  schema:
                     $ref: '#/components/schemas/AssetJsonUpdate'
         responses:
            '200':
               description: Asset updated
               content:
                  application/json:
                     schema:
                        $ref: '#/components/schemas/Asset'
            '400':
               $ref: '#/components/responses/BadRequest'
            '404':
               $ref: '#/components/responses/NotFound'
            '500':
               $ref: '#/components/responses/InternalServerError'
      patch:
         tags:
            - Assets
         operationId: updateAsset
         summary: Partially update an asset
         parameters:
            - $ref: '#/components/parameters/Id'
         requestBody:
            required: true
            content:
               application/json:
                  schema:
                     $ref: '#/components/schemas/AssetUpdate'
         responses:
            '200':
               description: Asset updated
               content:
                  application/json:
                     schema:
                        $ref: '#/components/schemas/Asset'
            '400':
               $ref: '#/components/responses/BadRequest'
            '404':
               $ref: '#/components/responses/NotFound'
            '409':
               $ref: '#/components/responses/Conflict'
            '500':
               $ref: '#/components/responses/InternalServerError'
      delete:
         tags:
            - Assets
         operationId: deleteAsset
         summary: Delete an asset
         parameters:
            - $ref: '#/components/parameters/Id'
         responses:
            '204':
               description: Asset deleted
            '404':
               $ref: '#/components/responses/NotFound'
            '500':
               $ref: '#/components/responses/InternalServerError'

   '/assets/{id}/paths':
      get:
         tags:
            - Assets
         operationId: listAssetPaths
         summary: List asset paths
         parameters:
            - $ref: '#/components/parameters/Id'
         responses:
            '200':
               description: Asset paths
               content:
                  application/json:
                     schema:
                        type: array
                        items:
                           $ref: '#/components/schemas/AssetData'
            '404':
               $ref: '#/components/responses/NotFound'
            '500':
               $ref: '#/components/responses/InternalServerError'
      post:
         tags:
            - Assets
         operationId: createAssetPath
         summary: Add a path to an asset
         parameters:
            - $ref: '#/components/parameters/Id'
         requestBody:
            required: true
            content:
               application/json:
                  schema:
                     $ref: '#/components/schemas/AssetDataInput'
         responses:
            '201':
               description: Path added
               content:
                  application/json:
                     schema:
                        $ref: '#/components/schemas/AssetData'
            '400':
               $ref: '#/components/responses/BadRequest'
            '404':
               $ref: '#/components/responses/NotFound'
            '409':
               $ref: '#/components/responses/Conflict'
            '500':
               $ref: '#/components/responses/InternalServerError'

   '/assets/{id}/paths/{pathId}':
      patch:
         tags:
            - Assets
         operationId: updateAssetPath
         summary: Update an asset path
         parameters:
            - $ref: '#/components/parameters/Id'
            - name: pathId
              in: path
              required: true
              description: Asset path identifier.
              schema:
                 type: integer
                 format: int32
         requestBody:
            required: true
            content:
               application/json:
                  schema:
                     $ref: '#/components/schemas/AssetDataInput'
         responses:
            '200':
               description: Path updated
               content:
                  application/json:
                     schema:
                        $ref: '#/components/schemas/AssetData'
            '400':
               $ref: '#/components/responses/BadRequest'
            '404':
               $ref: '#/components/responses/NotFound'
            '500':
               $ref: '#/components/responses/InternalServerError'

   '/assets/{id}/history':
      get:
         tags:
            - Assets
         operationId: listAssetHistory
         summary: Get asset history
         parameters:
            - $ref: '#/components/parameters/Id'
         responses:
            '200':
               description: Asset history
               content:
                  application/json:
                     schema:
                        type: array
                        items:
                           $ref: '#/components/schemas/AssetJson'
            '404':
               $ref: '#/components/responses/NotFound'
            '500':
               $ref: '#/components/responses/InternalServerError'

   '/assets/{id}/history/{historyId}':
      delete:
         tags:
            - Assets
         operationId: deleteAssetHistory
         summary: Delete an asset history entry
         parameters:
            - $ref: '#/components/parameters/Id'
            - name: historyId
              in: path
              required: true
              description: History entry identifier.
              schema:
                 type: integer
                 format: int32
         responses:
            '204':
               description: History deleted
            '404':
               $ref: '#/components/responses/NotFound'
            '500':
               $ref: '#/components/responses/InternalServerError'

   '/assets/{id}/{index}':
      get:
         tags:
            - Assets
         operationId: getAssetByIndex
         summary: Get asset by ID and index
         parameters:
            - $ref: '#/components/parameters/Id'
            - name: index
              in: path
              required: true
              description: Asset index.
              schema:
                 type: integer
                 format: int32
         responses:
            '200':
               description: Asset details
               content:
                  application/json:
                     schema:
                        $ref: '#/components/schemas/Asset'
            '404':
               $ref: '#/components/responses/NotFound'
            '500':
               $ref: '#/components/responses/InternalServerError'

   /racks:
      get:
         tags:
            - Racks
         operationId: listRacks
         summary: List all racks
         responses:
            '200':
               description: List of racks
               content:
                  application/json:
                     schema:
                        type: array
                        items:
                           $ref: '#/components/schemas/Rack'
            '500':
               $ref: '#/components/responses/InternalServerError'
      post:
         tags:
            - Racks
         operationId: createRack
         summary: Create a rack
         requestBody:
            required: true
            content:
               application/json:
                  schema:
                     $ref: '#/components/schemas/RackCreate'
         responses:
            '201':
               description: Rack created
               content:
                  application/json:
                     schema:
                        $ref: '#/components/schemas/Rack'
            '400':
               $ref: '#/components/responses/BadRequest'
            '409':
               $ref: '#/components/responses/Conflict'
            '500':
               $ref: '#/components/responses/InternalServerError'

   '/racks/{id}':
      get:
         tags:
            - Racks
         operationId: getRack
         summary: Get rack by ID
         parameters:
            - $ref: '#/components/parameters/Id'
         responses:
            '200':
               description: Rack details
               content:
                  application/json:
                     schema:
                        $ref: '#/components/schemas/Rack'
            '404':
               $ref: '#/components/responses/NotFound'
            '500':
               $ref: '#/components/responses/InternalServerError'
      patch:
         tags:
            - Racks
         operationId: updateRack
         summary: Partially update a rack
         parameters:
            - $ref: '#/components/parameters/Id'
         requestBody:
            required: true
            content:
               application/json:
                  schema:
                     $ref: '#/components/schemas/RackUpdate'
         responses:
            '200':
               description: Rack updated
               content:
                  application/json:
                     schema:
                        $ref: '#/components/schemas/Rack'
            '400':
               $ref: '#/components/responses/BadRequest'
            '404':
               $ref: '#/components/responses/NotFound'
            '409':
               $ref: '#/components/responses/Conflict'
            '500':
               $ref: '#/components/responses/InternalServerError'
      delete:
         tags:
            - Racks
         operationId: deleteRack
         summary: Delete a rack
         parameters:
            - $ref: '#/components/parameters/Id'
         responses:
            '204':
               description: Rack deleted
            '404':
               $ref: '#/components/responses/NotFound'
            '500':
               $ref: '#/components/responses/InternalServerError'

   '/racks/{id}/assets':
      get:
         tags:
            - Racks
         operationId: listRackAssets
         summary: List assets in a rack
         parameters:
            - $ref: '#/components/parameters/Id'
         responses:
            '200':
               description: Assets belonging to the rack
               content:
                  application/json:
                     schema:
                        type: array
                        items:
                           $ref: '#/components/schemas/Asset'
            '404':
               $ref: '#/components/responses/NotFound'
            '500':
               $ref: '#/components/responses/InternalServerError'

components:
   parameters:
      Id:
         name: id
         in: path
         required: true
         description: Resource identifier.
         schema:
            type: integer
            format: int32

   schemas:
      Asset:
         type: object
         description: An asset stored within a rack.
         required:
            - id
            - rackId
            - name
            - size
            - position
         properties:
            id:
               type: integer
               format: int32
               description: Asset identifier.
            rackId:
               type: integer
               format: int32
               description: Rack containing the asset.
            name:
               type: string
               description: Asset name.
            size:
               type: integer
               format: int32
               description: Height of the asset in rack units.
            position:
               type: integer
               format: int32
               description: Starting rack position.
            data:
               type: array
               description: Asset path data.
               items:
                  $ref: '#/components/schemas/AssetData'
            json:
               $ref: '#/components/schemas/AssetJson'
            pagination:
               $ref: '#/components/schemas/Pagination'
      AssetCreate:
         type: object
         description: Request body for creating an asset.
         required:
            - rackId
            - name
            - size
            - position
         properties:
            rackId:
               type: integer
               format: int32
            name:
               type: string
            size:
               type: integer
               format: int32
            position:
               type: integer
               format: int32
            data:
               type: array
               items:
                  $ref: '#/components/schemas/AssetDataInput'
            json:
               $ref: '#/components/schemas/AssetJson'
      AssetUpdate:
         type: object
         description: Fields that may be updated on an asset.
         properties:
            rackId:
               type: integer
               format: int32
            name:
               type: string
            size:
               type: integer
               format: int32
            position:
               type: integer
               format: int32
      AssetJsonUpdate:
         type: object
         description: Replace the stored JSON payload.
         required:
            - json
         properties:
            json:
               $ref: '#/components/schemas/AssetJson'
      AssetJson:
         type: object
         description: JSON payload associated with an asset.
         required:
            - text
            - filename
         properties:
            id:
               type: integer
               description: The id of the json in the history database
            text:
               type: string
               description: JSON content.
            filename:
               type: string
               description: Original filename.
      AssetData:
         type: object
         description: Asset path entry.
         required:
            - id
            - path
            - name
         properties:
            id:
               type: integer
               format: int32
            path:
               type: string
            name:
               type: string
            value:
               type: string
               nullable: true
      AssetDataInput:
         type: object
         description: Request body for creating or updating an asset path.
         required:
            - path
            - name
         properties:
            path:
               type: string
            name:
               type: string
      Rack:
         type: object
         description: A rack containing assets.
         required:
            - id
            - name
            - size
         properties:
            id:
               type: integer
               format: int32
            name:
               type: string
            size:
               type: integer
               format: int32
            notes:
               type: string
               nullable: true
      RackCreate:
         type: object
         description: Request body for creating a rack.
         required:
            - name
            - size
         properties:
            name:
               type: string
            size:
               type: integer
               format: int32
            notes:
               type: string
      RackUpdate:
         type: object
         description: Fields that may be updated on a rack.
         properties:
            name:
               type: string
            size:
               type: integer
               format: int32
            notes:
               type: string
      Pagination:
         type: object
         description: Pagination metadata.
         required:
            - position
            - total
         properties:
            position:
               type: integer
               format: int32
            total:
               type: integer
               format: int32
      Error:
         type: object
         description: Standard API error response.
         required:
            - error
            - message
         properties:
            error:
               type: string
               example: NOT_FOUND
            message:
               type: string
               example: The requested resource could not be found.
            details:
               type: object
               additionalProperties: true

   responses:
      BadRequest:
         description: Invalid request.
         content:
            application/json:
               schema:
                  $ref: '#/components/schemas/Error'
               example:
                  error: INVALID_REQUEST
                  message: One or more request fields are invalid.
      NotFound:
         description: Resource not found.
         content:
            application/json:
               schema:
                  $ref: '#/components/schemas/Error'
               example:
                  error: NOT_FOUND
                  message: The requested resource does not exist.
      Conflict:
         description: Request conflicts with an existing resource.
         content:
            application/json:
               schema:
                  $ref: '#/components/schemas/Error'
               example:
                  error: CONFLICT
                  message: An asset already exists at the requested position.
      InternalServerError:
         description: Internal server error.
         content:
            application/json:
               schema:
                  $ref: '#/components/schemas/Error'
               example:
                  error: INTERNAL_SERVER_ERROR
                  message: An unexpected error occurred.
